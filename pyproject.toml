[project]
name = "blackboxdc"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "Pillow>=10.0.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
